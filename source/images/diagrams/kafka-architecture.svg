<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" role="img" aria-label="Kafka 拓扑">
<defs>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1e2740" stroke-width="1"/></pattern>
<marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 z" fill="#a98bff"/></marker>
</defs>
<rect width="880" height="420" fill="#0d1120"/>
<rect width="880" height="420" fill="url(#g)"/>
<rect x="12" y="12" width="856" height="396" rx="10" fill="none" stroke="#2a3352" stroke-width="1.5"/>
<text x="30" y="42" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#45e0f5">FIG // Kafka 拓扑</text>
<text x="30" y="63" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7b88b0">Producer → Broker(Topic/Partition) → Consumer Group</text>
<line x1="30" y1="76" x2="850" y2="76" stroke="#2a3352" stroke-width="1"/>
<rect x="40" y="140" width="160" height="80" rx="8" fill="#121728" stroke="#45e0f5" stroke-width="1.6"/>
<text x="120.0" y="180.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#eef1ff">Producer</text>
<text x="120.0" y="200.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">业务服务</text><rect x="300" y="110" width="280" height="170" rx="8" fill="#121728" stroke="#a98bff" stroke-width="1.6"/>
<text x="440.0" y="195.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#eef1ff">Broker 集群</text>
<text x="440.0" y="215.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">Topic: order-events</text><rect x="320" y="150" width="110" height="50" rx="8" fill="#121728" stroke="#9ce884" stroke-width="1.6"/>
<text x="375.0" y="175.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#eef1ff">P0</text>
<text x="375.0" y="195.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">leader</text><rect x="450" y="150" width="110" height="50" rx="8" fill="#121728" stroke="#9ce884" stroke-width="1.6"/>
<text x="505.0" y="175.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#eef1ff">P1</text>
<text x="505.0" y="195.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">leader</text><rect x="320" y="215" width="110" height="50" rx="8" fill="#121728" stroke="#ffb86c" stroke-width="1.6"/>
<text x="375.0" y="240.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#eef1ff">P0-R</text>
<text x="375.0" y="260.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">replica</text><rect x="450" y="215" width="110" height="50" rx="8" fill="#121728" stroke="#ffb86c" stroke-width="1.6"/>
<text x="505.0" y="240.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#eef1ff">P1-R</text>
<text x="505.0" y="260.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">replica</text><rect x="680" y="140" width="160" height="80" rx="8" fill="#121728" stroke="#ff77c8" stroke-width="1.6"/>
<text x="760.0" y="180.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#eef1ff">Consumer</text>
<text x="760.0" y="200.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">Group: stock-svc</text><rect x="300" y="320" width="280" height="50" rx="8" fill="#121728" stroke="#7b88b0" stroke-width="1.6"/>
<text x="440.0" y="345.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#eef1ff">ZooKeeper / KRaft</text>
<text x="440.0" y="365.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">元数据与控制器</text><line x1="200" y1="180" x2="300" y2="180" stroke="#a98bff" stroke-width="2" marker-end="url(#ar)"/>
<text x="250.0" y="172.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#a98bff">send</text><line x1="580" y1="180" x2="680" y2="180" stroke="#a98bff" stroke-width="2" marker-end="url(#ar)"/>
<text x="630.0" y="172.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#a98bff">poll</text><line x1="440" y1="280" x2="440" y2="320" stroke="#a98bff" stroke-width="2" marker-end="url(#ar)"/>
<text x="440.0" y="292.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#a98bff">metadata</text><text x="40" y="392" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7b88b0">分区数决定单 Topic 的并行上限；同组内一个分区只会被一个消费者占用</text></svg>
