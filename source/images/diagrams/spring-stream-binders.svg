<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" role="img" aria-label="Spring Cloud Stream Binder 模型">
<defs>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1e2740" stroke-width="1"/></pattern>
<marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 z" fill="#a98bff"/></marker>
</defs>
<rect width="880" height="340" fill="#0d1120"/>
<rect width="880" height="340" fill="url(#g)"/>
<rect x="12" y="12" width="856" height="316" rx="10" fill="none" stroke="#2a3352" stroke-width="1.5"/>
<text x="30" y="42" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#45e0f5">FIG // Spring Cloud Stream Binder 模型</text>
<text x="30" y="63" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7b88b0">业务代码只面向绑定接口，中间件差异交给 Binder</text>
<line x1="30" y1="76" x2="850" y2="76" stroke="#2a3352" stroke-width="1"/>
<rect x="50" y="140" width="200" height="80" rx="8" fill="#121728" stroke="#45e0f5" stroke-width="1.6"/>
<text x="150.0" y="180.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#eef1ff">Application</text>
<text x="150.0" y="200.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">@StreamListener / Function</text><rect x="340" y="120" width="220" height="120" rx="8" fill="#121728" stroke="#a98bff" stroke-width="1.6"/>
<text x="450.0" y="180.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#eef1ff">Binder</text>
<text x="450.0" y="200.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">Kafka / RabbitMQ</text><rect x="660" y="140" width="170" height="80" rx="8" fill="#121728" stroke="#ff77c8" stroke-width="1.6"/>
<text x="745.0" y="180.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#eef1ff">Message Broker</text>
<text x="745.0" y="200.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">Topic / Exchange</text><line x1="250" y1="180" x2="340" y2="180" stroke="#a98bff" stroke-width="2" marker-end="url(#ar)"/>
<text x="295.0" y="172.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#a98bff">Message&lt;?&gt;</text><line x1="560" y1="180" x2="660" y2="180" stroke="#a98bff" stroke-width="2" marker-end="url(#ar)"/>
<text x="610.0" y="172.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#a98bff">bind</text><text x="50" y="300" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7b88b0">换 MQ 时改依赖和配置，不动业务代码 —— 前提是你没在业务里直接引 broker 客户端 API</text></svg>
