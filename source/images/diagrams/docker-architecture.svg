<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" role="img" aria-label="Docker 架构">
<defs>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1e2740" stroke-width="1"/></pattern>
<marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 z" fill="#a98bff"/></marker>
</defs>
<rect width="880" height="400" fill="#0d1120"/>
<rect width="880" height="400" fill="url(#g)"/>
<rect x="12" y="12" width="856" height="376" rx="10" fill="none" stroke="#2a3352" stroke-width="1.5"/>
<text x="30" y="42" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#45e0f5">FIG // Docker 架构</text>
<text x="30" y="63" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7b88b0">Client / Daemon / Image / Container / Registry 的关系（重绘于 2026，替换失效的 2021 年截图）</text>
<line x1="30" y1="76" x2="850" y2="76" stroke="#2a3352" stroke-width="1"/>
<rect x="40" y="120" width="180" height="80" rx="8" fill="#121728" stroke="#45e0f5" stroke-width="1.6"/>
<text x="130.0" y="160.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#eef1ff">Docker CLI</text>
<text x="130.0" y="180.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">docker build / run / pull</text><rect x="330" y="110" width="220" height="100" rx="8" fill="#121728" stroke="#a98bff" stroke-width="1.6"/>
<text x="440.0" y="160.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#eef1ff">Docker Daemon</text>
<text x="440.0" y="180.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">dockerd</text><rect x="660" y="110" width="180" height="80" rx="8" fill="#121728" stroke="#ff77c8" stroke-width="1.6"/>
<text x="750.0" y="150.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#eef1ff">Registry</text>
<text x="750.0" y="170.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">Docker Hub / 私有仓</text><rect x="300" y="270" width="160" height="70" rx="8" fill="#121728" stroke="#9ce884" stroke-width="1.6"/>
<text x="380.0" y="305.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#eef1ff">Image</text>
<text x="380.0" y="325.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">只读模板</text><rect x="520" y="270" width="160" height="70" rx="8" fill="#121728" stroke="#9ce884" stroke-width="1.6"/>
<text x="600.0" y="305.0" text-anchor="middle" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="15" fill="#eef1ff">Container</text>
<text x="600.0" y="325.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#7b88b0">可写层 + 进程</text><line x1="220" y1="160" x2="330" y2="160" stroke="#a98bff" stroke-width="2" marker-end="url(#ar)"/>
<text x="275.0" y="152.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#a98bff">REST API</text><line x1="550" y1="150" x2="660" y2="150" stroke="#a98bff" stroke-width="2" marker-end="url(#ar)"/>
<text x="605.0" y="142.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#a98bff">pull / push</text><line x1="380" y1="210" x2="380" y2="270" stroke="#a98bff" stroke-width="2" marker-end="url(#ar)"/>
<text x="380.0" y="232.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#a98bff">build</text><line x1="460" y1="305" x2="520" y2="305" stroke="#a98bff" stroke-width="2" marker-end="url(#ar)"/>
<text x="490.0" y="297.0" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#a98bff">run</text><text x="40" y="368" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#7b88b0">镜像是静态定义，容器是运行实例 —— 类与对象的关系</text></svg>
